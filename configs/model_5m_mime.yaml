model:
  name: mime_factorized_transformer_5m
  target_domain: motor_imagery_motor_execution
  input_seconds: 4.0
  sampling_rate: 160
  max_channels: 64
  default_channels: 64
  patch_seconds: 0.5
  patch_stride_seconds: 0.5
  d_model: 224
  depth: 6
  num_heads: 8
  mlp_ratio: 4
  dropout: 0.1
  attention_dropout: 0.1
  use_channel_embedding: true
  use_time_embedding: true
  use_bandpower_embedding: true
  factorized_attention: temporal_then_spatial

mi_me_priors:
  motor_bands_hz:
    mu: [8.0, 12.0]
    low_beta: [13.0, 20.0]
    high_beta: [20.0, 30.0]
  recommended_channels:
    - C3
    - Cz
    - C4
    - FC3
    - FCz
    - FC4
    - CP3
    - CPz
    - CP4
  hierarchical_labels:
    state:
      - me
      - mi
    body:
      - left_hand
      - right_hand
      - both_hands
      - feet

pretraining:
  task: masked_channel_time_reconstruction
  mask_ratio: 0.55
  mask_policy: motor_region_biased_channel_time
  raw_mse_weight: 1.0
  spectral_mse_weight: 0.3
  bandpower_mse_weight: 0.5
  optimizer: adamw
  learning_rate: 0.0003
  weight_decay: 0.05
  warmup_ratio: 0.05

fine_tuning:
  heads:
    - state_2class
    - body_4class
    - joint_8class
  default_strategy: frozen_encoder_linear_probe_then_lora
  few_shot_trials_per_class:
    - 1
    - 3
    - 5
    - 10

preprocessing:
  resample_hz: 160
  bandpass_hz: [0.5, 45.0]
  mi_bandpass_hz: [8.0, 30.0]
  notch_hz: 50.0
  reference: average
  unit: microvolt
  eval_window_seconds: [0.5, 3.5]

evaluation:
  splits:
    - subject_holdout
    - leave_one_subject_out
    - session_holdout
  baselines:
    - fbcsp_lda
    - riemannian_tangent_space
    - eegnet
    - minirocket

