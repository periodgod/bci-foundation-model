[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eeg-mime-foundation"
version = "0.1.0"
description = "Modular EEG and time-series research preparation with reproducible training and evaluation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.0",
  "numpy>=1.23",
]

[project.optional-dependencies]
eeg = [
  "mne>=1.8",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "requests>=2.31",
  "matplotlib>=3.8",
]
dev = [
  "pytest>=7.0",
]

[project.scripts]
eeg-research = "eeg_mime_foundation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
